# Builds the release APK for a version tag (vX.Y.Z, vX.Y.Z-rcN or vX.Y.Z-spike) and publishes it as a GitHub Release
# with SHA-256 checksums and the notes of that version from CHANGELOG.md. See RELEASING.md.
#
# With the UG_KEYSTORE_* secrets set, the APK is signed with the release key. Without them it is signed with the debug
# key, which is installable but not suitable for distribution: the release is then a pre-release marked UNSIGNED-DEBUG.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check the tag and the release notes
        run: |
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match appVersion $version"; exit 1; }
          scripts/release-notes.sh "$version" > notes.md

      - name: Check and build the release APK
        env:
          UG_KEYSTORE_BASE64: ${{ secrets.UG_KEYSTORE_BASE64 }}
          UG_KEYSTORE_PASSWORD: ${{ secrets.UG_KEYSTORE_PASSWORD }}
          UG_KEY_ALIAS: ${{ secrets.UG_KEY_ALIAS }}
          UG_KEY_PASSWORD: ${{ secrets.UG_KEY_PASSWORD }}
        run: |
          if [ -n "$UG_KEYSTORE_BASE64" ] && [ -n "$UG_KEYSTORE_PASSWORD" ] && [ -n "$UG_KEY_ALIAS" ] && [ -n "$UG_KEY_PASSWORD" ]; then
            export UG_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "$UG_KEYSTORE_BASE64" | base64 -d > "$UG_KEYSTORE_FILE"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi
          ./gradlew check assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify there are no Google dependencies (GMS, Firebase, ML Kit)
        run: scripts/check-no-google.sh app/build/outputs/apk/release/app-release.apk

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="UltimateAlarm-$version.apk"
          title="UltimateAlarm $version"
          flags=()
          # Pre-release for -rcN / -spike versions and for any debug-signed build.
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          if [ "$SIGNED" = "debug" ]; then
            apk="UltimateAlarm-$version-UNSIGNED-DEBUG.apk"
            title="$title (UNSIGNED-DEBUG)"
            flags=(--prerelease)
            printf '\n> **UNSIGNED-DEBUG:** this APK is signed with the debug key because no release signing key is configured. It is installable for testing, but it is not a distribution build.\n' >> notes.md
          fi
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$apk" SHA256SUMS.txt --title "$title" --notes-file notes.md "${flags[@]}"
