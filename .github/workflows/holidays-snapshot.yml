# Regenerates the holiday snapshot embedded in the APK (docs/spec/02-diseno.md §6) and opens a PR when it changed.
# Monthly, and by hand before each release (RELEASING.md). PRs opened with the workflow token do not start CI by
# themselves: close and reopen the PR (or push to its branch) to run the checks before merging.
name: Holidays snapshot

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the holidays
        run: tools/holidays-snapshot/snapshot.sh

      - name: Open a PR if the snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Snapshot unchanged."; exit 0; fi
          branch="chore/holidays-snapshot-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add feature/holidays/src/main/assets/holidays
          git commit -m "chore(holidays): refresh the embedded holiday snapshot"
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(holidays): refresh the embedded holiday snapshot" \
            --body "Generated by the Holidays snapshot workflow from Nager.Date v3."
