name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No signing material is committed
        run: |
          found=$(git ls-files | grep -Ei '\.(jks|keystore|p12|pem)$' || true)
          test -z "$found" || { echo "Signing material in the repository: $found"; exit 1; }

      - name: Strings exist in English and Spanish
        run: scripts/check-strings.sh

      - name: Every bundled sound has a licence entry
        run: scripts/check-sound-licenses.sh

      - name: Release notes for the current version (CHANGELOG.md and F-Droid changelogs)
        run: scripts/release-notes.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # check = ktlint, detekt, Android lint, unit tests and the 90 % coverage gate of :core:scheduling.
      - name: Lint, static analysis, unit tests, coverage, debug and shrunk release builds
        run: ./gradlew check assembleDebug assembleRelease

      - name: Verify there are no Google dependencies (GMS, Firebase, ML Kit)
        run: scripts/check-no-google.sh app/build/outputs/apk/release/app-universal-release.apk

      - name: Verify the shrunk APK keeps every manufacturer guide text
        run: scripts/check-oem-strings.sh app/build/outputs/apk/release/app-universal-release.apk

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 14
